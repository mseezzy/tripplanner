<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Authentication & MFA Prototype - Family Travel Planner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { width: 100%; max-width: 440px; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .header { background: linear-gradient(135deg, #0284c7 0%, #4338ca 100%); color: #ffffff; padding: 24px; text-align: center; }
    .header h1 { font-size: 22px; font-weight: 700; }
    .header p { font-size: 13px; color: #e0f2fe; margin-top: 4px; }
    .tabs { display: flex; border-bottom: 1px solid #e2e8f0; }
    .tab-btn { flex: 1; padding: 12px; font-size: 14px; font-weight: 600; border: none; background: transparent; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #0284c7; border-bottom: 2px solid #0284c7; }
    .body { padding: 24px; }
    .sso-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 20px 0; }
    .sso-btn { padding: 10px 6px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 12px; font-weight: 600; background: #ffffff; cursor: pointer; text-align: center; }
    .sso-btn:hover { background: #f8fafc; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: #f8fafc; }
    .btn-submit { width: 100%; padding: 12px; background: #0284c7; color: #ffffff; font-weight: 700; font-size: 14px; border: none; border-radius: 8px; cursor: pointer; }
    .btn-submit:hover { background: #0369a1; }
    .footer { background: #f8fafc; padding: 12px 24px; border-top: 1px solid #e2e8f0; text-align: center; font-size: 12px; color: #64748b; }
    .focus-ring:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="auth-title">
    <header class="header">
      <h1 id="auth-title">Family Travel Planner</h1>
      <p>Sign in to access personalized itineraries and budget tools</p>
    </header>
    <nav class="tabs" aria-label="Authentication Tabs">
      <button type="button" class="tab-btn active focus-ring" aria-current="page">Sign In</button>
      <button type="button" class="tab-btn focus-ring">Create Account</button>
    </nav>
    <div class="body">
      <section aria-label="Social Single Sign-On">
        <div class="sso-grid">
          <button type="button" class="sso-btn focus-ring">Google</button>
          <button type="button" class="sso-btn focus-ring">Facebook</button>
          <button type="button" class="sso-btn focus-ring">GitHub</button>
        </div>
      </section>
      <form action="#" method="POST">
        <div class="form-group">
          <label for="email-input" class="form-label">Email Address</label>
          <input type="email" id="email-input" name="email" required placeholder="you@familytrip.com" class="form-input focus-ring">
        </div>
        <div class="form-group">
          <label for="password-input" class="form-label">Password</label>
          <input type="password" id="password-input" name="password" required placeholder="••••••••••••" class="form-input focus-ring">
        </div>
        <button type="submit" class="btn-submit focus-ring">Sign In</button>
      </form>
    </div>
    <footer class="footer">
      🔒 Secure, verified, and free forever &bull; WCAG 2.1 AA Compliant
    </footer>
  </main>
</body>
</html>
